name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 26 build and test
    runs-on: macos-26
    timeout-minutes: 60

    env:
      SCHEME: MenuBarDeclutter
      DESTINATION: platform=macOS
      RESULT_BUNDLE_PATH: build/TestResults/ci.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: List schemes
        run: xcodebuild -list -project MenuBar-Manager.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          mkdir -p "$(dirname "$RESULT_BUNDLE_PATH")"
          rm -rf "$RESULT_BUNDLE_PATH"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -enableCodeCoverage NO \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify privacy boundary
        run: scripts/verify_privacy_boundary.sh

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-xcresult
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore
